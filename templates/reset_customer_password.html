{% extends "base.html" %}

{% block content %}

<h1>🔑 Reset Customer Password</h1>
<p class="sub">Reset password for: <b>{{ customer.full_name }}</b></p>

<div class="card">
    <div style="background:#f8f9fa;padding:15px;border-radius:8px;margin-bottom:20px;">
        <div class="grid">
            <div class="metric">
                <div class="label">Customer</div>
                <div class="value" style="font-size:18px;">{{ customer.full_name }}</div>
            </div>
            <div class="metric">
                <div class="label">Username</div>
                <div class="value" style="font-size:18px;">{{ customer.username }}</div>
            </div>
            <div class="metric">
                <div class="label">Phone</div>
                <div class="value" style="font-size:18px;">{{ customer.phone }}</div>
            </div>
        </div>
    </div>
    
    <form method="post">
        <div class="formgrid">
            <label style="grid-column: span 2;">
                New Password (minimum 6 characters)
                <input type="text" name="new_password" placeholder="Enter new password" required minlength="6">
                <small style="color:#667085;display:block;margin-top:5px;">
                    ⚠️ This will generate a new password. The customer will need to use this new password to login.
                </small>
            </label>
        </div>
        <div style="margin-top:20px;display:flex;gap:10px;">
            <button class="btn yellow" type="submit">🔄 Reset Password</button>
            <a href="{{ url_for('customers') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>

<div class="actions">
    <a href="{{ url_for('customers') }}" class="btn">← Back to Customers</a>
</div>

{% endblock %}
