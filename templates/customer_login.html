<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "RAB Customer Login" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="login">
        <div class="card" style="text-align:center;">
            <img src="{{ url_for('static', filename='Mylogo.png') }}" 
                 alt="RAB Rent A Bike" 
                 style="height:180px; width:390px; margin-bottom:10px;">
            <h1 style="font-size:28px;color:#0d1f46;">RAB</h1>
            <p style="color:#667085;margin-bottom:25px;font-size:14px;letter-spacing:2px;">CUSTOMER LOGIN</p>
            

            
            <form method="post">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <label style="display:block;text-align:left;">
                    Username
                    <input type="text" name="username" placeholder="Enter your username" required>
                </label>
                <label style="display:block;text-align:left;margin-top:12px;">
                    Password
                    <input type="password" name="password" placeholder="Enter your password" required>
                </label>
                
                <button class="btn yellow" style="width:100%;margin-top:20px;padding:12px;font-size:16px;">
                    Sign in
                </button>
            </form>
            
            <p style="margin-top:15px;font-size:12px;color:#667085;text-align:center;">
                By logging in you agree to our
                <a href="{{ url_for('privacy_policy') }}" style="color:#0d1f46;">Privacy Policy</a>.
            </p>

            <div style="margin-top: 15px;">
                <a href="{{ url_for('home') }}" style="color: #667085; text-decoration: none; font-size: 14px;">
                    🔙 Back to Portal
                </a>
            </div>


            {% with msgs = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in msgs %}
                    <div class="flash {{ cat }}" style="margin-top:15px;">{{ msg }}</div>
                {% endfor %}
            {% endwith %}
            
            <p style="margin-top:20px;color:#667085;font-size:12px;">
                Don't have an account? <a href="{{ url_for('customers') }}" style="color:#0d1f46;">Contact us</a> to register.
            </p>
        </div>
    </div>
</body>
</html>
