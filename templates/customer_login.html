<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title or "RAB Customer Login" }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    

    <style>
        body {
            /* ✅ Background Image Setup */
            background-image: url("{{ url_for('static', filename='staff.png') }}");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-card {
            background: transparent;
            padding: 40px;
            border-radius: 16px;
            box-shadow: transparent;
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 0px solid #e4e7ec;
        }

        .login-card img {
            height: 130px;
            width: auto;
            margin-bottom: 10px;
        }
    </style>


</head>
<body>
    <div class="login-card">
        <img src="{{ url_for('static', filename='Mylogo.png') }}" 
             alt="RAB Rent A Bike">
             
        <h1 style="font-size:28px;color:#0d1f46; margin:0;">RAB</h1>
        <p style="color:#667085;margin-bottom:25px;font-size:14px;letter-spacing:2px;">CUSTOMER LOGIN</p>
        
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label style="display:block;text-align:left;">
                Username
                <input type="text" name="username" placeholder="Enter your username" required>
            </label>
            <label style="display:block;text-align:left;margin-top:12px;">
                Password
                <input type="password" name="password" placeholder="Enter your password" required>
            </label>
            
            <button class="btn yellow" style="width:100%;margin-top:20px;padding:12px;font-size:16px;">
                Sign in
            </button>
        </form>
        
        <p style="margin-top:15px;font-size:12px;color:#667085;text-align:center;">
            By logging in you agree to our
            <a href="{{ url_for('privacy_policy') }}" style="color:#0d1f46;">Privacy Policy</a>.
        </p>

        <div style="margin-top: 15px;">
            <a href="{{ url_for('home') }}" style="color: #667085; text-decoration: none; font-size: 14px;">
                🔙 Back to Portal
            </a>
        </div>

        {% with msgs = get_flashed_messages(with_categories=true) %}
            {% for cat, msg in msgs %}
                <div class="flash {{ cat }}" style="margin-top:15px; padding:10px; border-radius:5px; background:#fdeceb; color:#dc3545;">{{ msg }}</div>
            {% endfor %}
        {% endwith %}
        
        <p style="margin-top:20px;color:#667085;font-size:12px;">
            Don't have an account? <a href="{{ url_for('customers') }}" style="color:#0d1f46;">Contact us</a> to register.
        </p>
    </div>
</body>
</html>
