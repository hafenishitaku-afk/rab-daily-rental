{% extends "base.html" %}

{% block content %}

<div class="actions" style="margin-bottom:20px;">
    <a href="{{ url_for('view_documents', customer_id=customer_id) }}" class="btn">
        ← Back to Documents
    </a>
    <a href="{{ url_for('static', filename=doc.file_path) }}" target="_blank" class="btn yellow">
        📄 Open Full Size
    </a>
</div>

<div class="card" style="text-align:center;padding:20px;">
    <h2>{{ doc.document_type.replace('_', ' ').title() }}</h2>
    <p class="sub">Uploaded: {{ doc.uploaded_at }}</p>
    
    <div style="margin-top:20px;">
        {% if doc.file_path.endswith('.pdf') %}
            <embed src="{{ url_for('static', filename=doc.file_path) }}" 
                   type="application/pdf" 
                   style="width:100%;height:500px;">
        {% else %}
            <img src="{{ url_for('static', filename=doc.file_path) }}" 
                 alt="Document" 
                 style="max-width:100%;max-height:600px;border-radius:8px;border:1px solid #ddd;">
        {% endif %}
    </div>
</div>

<div class="actions">
    <a href="{{ url_for('customers') }}" class="btn">← Back to Customers</a>
</div>

{% endblock %}
