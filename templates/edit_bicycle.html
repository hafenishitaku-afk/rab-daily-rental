{% extends "base.html" %}

{% block content %}

<h1>✏️ Edit Bicycle</h1>
<p class="sub">Update bicycle details.</p>

<div class="card">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="formgrid">
            <label>
                Bike Code *
                <input type="text" name="bike_code" value="{{ bicycle.bike_code }}" required>
            </label>
            <label>
                Bike Type
                <select name="bike_type">
                    <option value="Standard" {% if bicycle.bike_type == 'Standard' %}selected{% endif %}>Standard</option>
                    <option value="Electric" {% if bicycle.bike_type == 'Electric' %}selected{% endif %}>Electric</option>
                    <option value="Mountain" {% if bicycle.bike_type == 'Mountain' %}selected{% endif %}>Mountain</option>
                </select>
            </label>
            <label>
                Brand
                <input type="text" name="brand" value="{{ bicycle.brand or '' }}">
            </label>
            <label>
                Model
                <input type="text" name="model" value="{{ bicycle.model or '' }}">
            </label>
            <label>
                Hourly Rate (N$)
                <input type="number" step="0.01" name="hourly_rate" value="{{ bicycle.hourly_rate }}">
            </label>
            <label>
                Daily Cap (N$)
                <input type="number" step="0.01" name="daily_cap" value="{{ bicycle.daily_cap }}">
            </label>
            <label>
                Deposit (N$)
                <input type="number" step="0.01" name="deposit_amount" value="{{ bicycle.deposit_amount }}">
            </label>
            <label>
                Notes
                <input type="text" name="notes" value="{{ bicycle.notes or '' }}">
            </label>

            <label>
                Current Station
                <select name="current_station_id">
                    <option value="">— Not assigned —</option>
                    {% for s in stations %}
                    <option value="{{ s.id }}"
                            {% if bicycle.current_station_id and bicycle.current_station_id|string == s.id|string %}selected{% endif %}>
                        {{ s.name }}
                    </option>
                    {% endfor %}
                </select>
                <small style="color:#667085;display:block;margin-top:4px;">
                    📍 Where this bicycle is currently located.
                </small>
            </label>
        </div>
        <div style="margin-top:20px;display:flex;gap:10px;">
            <button class="btn yellow" type="submit">💾 Update Bicycle</button>
            <a href="{{ url_for('bicycles') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
