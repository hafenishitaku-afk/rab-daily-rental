<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome - RAB Daily Rentals</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            /* ✅ Background Image */
            background-image: url("{{ url_for('static', filename='register_bbg.png') }}");
            background-size: 93%;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            margin: 0;
            font-family: system-ui, sans-serif;
        }

        .portal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 85vh;
            /* ✅ REMOVED the dark overlay, replaced with a very slight shadow to make the card pop */
            background: transparent; 
            padding: 20px;
        }

        .portal-card {
            background: transparent;
            padding: 40px;
            border-radius: 16px;
            box-shadow: transparent;
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 0px solid #e4e7ec;
        }

        .portal-btn {
            display: block;
            width: 100%;
            padding: 16px;
            margin-bottom: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s;
            cursor: pointer;
            box-sizing: border-box;
        }

        .btn-staff {
            background-color: #ffe500;
            color: #111;
            border: none;
        }
        .btn-staff:hover { 
            background-color: #ffd000; 
        }
        
        .btn-customer {
            background-color: #0d1f46;
            color: #fff;
        }
        .btn-customer:hover { 
            background-color: #1a305e; 
        }

        .btn-register {
            background-color: #16834b;
            color: #fff;
        }
        .btn-register:hover { 
            background-color: #11693b; 
        }
    </style>
</head>
<body>
    <div class="portal-container">
        <div class="portal-card">

            <!-- Logo -->
            <img src="{{ url_for('static', filename='Mylogo.png') }}" 
                 alt="RAB Rent A Bike" 
                 style="height:120px; width:auto; margin-bottom:10px;"> 
                 
            <h1 style="color: #0d1f46; margin-bottom: 5px;">Welcome to RAB</h1>                
            <p style="color: #667085; margin-bottom: 25px;">Please select how you want to proceed.</p>

            <!-- Flash Messages -->
            {% with msgs = get_flashed_messages(with_categories=true) %}
                {% for cat, msg in msgs %}
                    <div class="flash {{ cat }}" style="margin-bottom:15px; padding:10px; border-radius:5px; background:#fdeceb; color:#dc3545;">{{ msg }}</div>
                {% endfor %}
            {% endwith %}

            <!-- STAFF LOGIN -->
            <form action="{{ url_for('staff_verify') }}" method="POST" style="margin-bottom: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px; border: 1px solid #ffe500;">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                <label style="display:block; text-align:left; font-weight:bold; margin-bottom:8px; color:#0d1f46;">👔 Staff Access</label>
                <input type="text" name="username" placeholder="Enter your staff username" required
                       style="width:100%; padding:12px; border:1px solid #ddd; border-radius:6px; margin-bottom:12px; box-sizing:border-box; outline: none;">
                <button type="submit" class="portal-btn btn-staff" style="margin:0;">
                    Continue to Staff Login &rarr;
                </button>
            </form>

            <hr style="border: 0; border-top: 1px solid #e4e7ec; margin: 20px 0;">

            <!-- CUSTOMER LOGIN -->
            <a href="{{ url_for('customer_login') }}" class="portal-btn btn-customer">
                👤 Customer Login
            </a>
        </div>
    </div>
</body>
</html>
