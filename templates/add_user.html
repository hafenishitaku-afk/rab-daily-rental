{% extends "base.html" %}

{% block content %}

<h1>➕ Add User</h1>
<p class="sub">Create a new system user.</p>

<div class="card">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="formgrid">
            <label>
                Username *
                <input type="text" name="username" required>
            </label>
            <label>
                Password *
                <input type="password" name="password" required>
            </label>
            <label>
                Full Name
                <input type="text" name="full_name">
            </label>
            <label>
                Email
                <input type="email" name="email">
            </label>
            <label>
                Role
                <select name="role">
                    <option value="admin">Admin</option>
                    <option value="manager">Manager</option>
                    <option value="staff" selected>Staff</option>
                </select>
            </label>

            <!-- <label>
                Assigned Station
                <select name="branch_id">
                    <option value="">— None (Head Office) —</option>
                    {% for s in stations %}
                    <option value="{{ s.id }}">{{ s.name }}{% if s.location %} — {{ s.location }}{% endif %}</option>
                    {% endfor %}
                </select>
                <small style="color:#667085;display:block;margin-top:4px;">
                    📍 The station this user works at. Rentals they start will default to this station.
                </small>
            </label> -->

            <label>
                Assigned Station
                <select name="branch_id">
                    <option value="">-- None (Head Office) --</option>
                    {% for s in stations %}
                    <option value="{{ s.id }}">{{ s.name }}{% if s.location %} ({{ s.location }}){% endif %}</option>
                    {% endfor %}
                </select>
                <small style="color:#667085;display:block;margin-top:4px;">
                    The station this user works at. Rentals they start will default to this station.
                </small>
            </label>


        </div>
        <div style="margin-top:20px;display:flex;gap:10px;">
            <button class="btn yellow" type="submit">➕ Create User</button>
            <a href="{{ url_for('users') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
