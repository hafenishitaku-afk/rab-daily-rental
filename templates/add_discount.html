{% extends "base.html" %}

{% block content %}

<h1>➕ Add Discount Code</h1>
<p class="sub">Create a new promotional discount code.</p>

<div class="card">
    <form method="post">
        <div class="formgrid">
            <label>
                Code *
                <input type="text" name="code" placeholder="SUMMER2024" required>
            </label>
            <label>
                Description
                <input type="text" name="description" placeholder="Summer sale discount">
            </label>
            <label>
                Discount Type
                <select name="discount_type">
                    <option value="percentage">Percentage (%)</option>
                    <option value="fixed">Fixed Amount (N$)</option>
                </select>
            </label>
            <label>
                Discount Value *
                <input type="number" step="0.01" name="discount_value" placeholder="10" required>
            </label>
            <label>
                Minimum Rental Amount
                <input type="number" step="0.01" name="min_rental_amount" value="0">
            </label>
            <label>
                Max Uses (0 = unlimited)
                <input type="number" name="max_uses" value="0">
            </label>
            <label>
                Start Date
                <input type="date" name="start_date">
            </label>
            <label>
                End Date
                <input type="date" name="end_date">
            </label>
        </div>
        <div style="margin-top:20px;display:flex;gap:10px;">
            <button class="btn yellow" type="submit">💾 Create Discount</button>
            <a href="{{ url_for('discounts') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
