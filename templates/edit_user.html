{% extends "base.html" %}

{% block content %}

<h1>✏️ Edit User</h1>
<p class="sub">Edit user: <b>{{ user.username }}</b></p>

<div class="card">
    <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="formgrid">
            <label>
                Full Name
                <input type="text" name="full_name" value="{{ user.full_name or '' }}">
            </label>
            <label>
                Email
                <input type="email" name="email" value="{{ user.email or '' }}">
            </label>
            <label>
                Role
                <select name="role">
                    <option value="admin" {% if user.role == 'admin' %}selected{% endif %}>Admin</option>
                    <option value="manager" {% if user.role == 'manager' %}selected{% endif %}>Manager</option>
                    <option value="staff" {% if user.role == 'staff' %}selected{% endif %}>Staff</option>
                </select>
            </label>

            <label>
                Assigned Station
                <select name="branch_id">
                    <option value="" {% if not user.branch_id %}selected{% endif %}>-- None (Head Office) --</option>
                    {% for s in stations %}
                    <option value="{{ s.id }}"
                            {% if user.branch_id and user.branch_id|string == s.id|string %}selected{% endif %}>
                        {{ s.name }}{% if s.location %} ({{ s.location }}){% endif %}
                    </option>
                    {% endfor %}
                </select>
                <small style="color:#667085;display:block;margin-top:4px;">
                    The station this user works at. Rentals they start will default to this station.
                </small>
            </label>

            <label>
                New Password
                <input type="password" name="new_password" placeholder="Leave blank to keep current">
            </label>
        </div>
        <div style="margin-top:20px;display:flex;gap:10px;">
            <button class="btn yellow" type="submit">💾 Save Changes</button>
            <a href="{{ url_for('users') }}" class="btn">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
